# WII HYBRID para Super Mario Galaxy (USA): lo de default.ini, con lo que cambia en este juego.
# Prioridades del juego: moverse con el stick izquierdo, apuntar con el derecho, girar con R1, saltar con B, lanzar trozos de
# estrella con A o R2, agacharse con L2 y recentrar la camara con L1, todo a la vez.
name=WII HYBRID - Super Mario Galaxy

bind.switch_pro.a=B
bind.switch_pro.b=A, ZR
bind.switch_pro.one=X
bind.switch_pro.two=Y
bind.switch_pro.plus=Plus
bind.switch_pro.minus=Minus
bind.switch_pro.home=Home
bind.switch_pro.jump_back=None

# La camara va en la cruceta; el stick derecho solo apunta (la tabla ya no lo lista en la cruceta).
bind.switch_pro.dpad_up=DpadUp
bind.switch_pro.dpad_down=DpadDown
bind.switch_pro.dpad_left=DpadLeft
bind.switch_pro.dpad_right=DpadRight

bind.switch_pro.stick_up=LY+
bind.switch_pro.stick_down=LY-
bind.switch_pro.stick_left=LX-
bind.switch_pro.stick_right=LX+
bind.switch_pro.z=ZL
bind.switch_pro.c=L

bind.switch_pro.pointer_up=RY+
bind.switch_pro.pointer_down=RY-
bind.switch_pro.pointer_left=RX-
bind.switch_pro.pointer_right=RX+
bind.switch_pro.pointer_recenter=RS

# El giro de Mario: R1 sacude el Nunchuk (el juego gira con la sacudida de cualquiera de los dos). Para que R1 sacuda el
# Wiimote, pon shake=R y nunchuk_shake=None. Tocar R1 es una sacudida (un giro); mantenerlo sigue sacudiendo, y asi Mario
# sube las enredaderas y los tallos con R1 apretado (GALAXY_SHAKE_HOLD=0 lo quita). Son lecturas sinteticas: la consola no
# tiene acelerometro.
bind.switch_pro.shake=None
bind.switch_pro.nunchuk_shake=R

tune.switch_pro.stick_deadzone=0.12
tune.switch_pro.pointer_deadzone=0.12
tune.switch_pro.pointer_speed=2.4
tune.switch_pro.invert_pointer_y=0
# En Galaxy el puntero se oculta tras 4 s quieto (como el Wiimote apuntando fuera de la pantalla).
tune.switch_pro.pointer_hide_seconds=4
