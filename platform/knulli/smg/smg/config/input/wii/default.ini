# WII HYBRID - RG35XX H: el perfil base para un juego de Wii con Wii Remote + Nunchuk virtual.
# Lineas bind.<esquema>.<destino>=botones (separados por comas; None = ninguno) y tune.<esquema>.<ajuste>=valor, las mismas
# que smg/settings.ini; solo vale el esquema switch_pro (el de la consola). Botones por su etiqueta Nintendo: A es el de
# la derecha, B el de abajo, X el de arriba, Y el de la izquierda; L/R son L1/R1 y ZL/ZR son L2/R2; LS/RS, el clic de los sticks.
name=WII HYBRID - RG35XX H

# Botones del Wii Remote: A (saltar, confirmar) en el B de abajo; B (disparar, volver) en el A de la derecha y en R2.
bind.switch_pro.a=B
bind.switch_pro.b=A, ZR
bind.switch_pro.one=X
bind.switch_pro.two=Y
bind.switch_pro.plus=Plus
bind.switch_pro.minus=Minus
bind.switch_pro.home=Home
bind.switch_pro.jump_back=None

# Cruceta (en SMG, la camara). El stick derecho es solo el puntero, sin tocar la cruceta.
bind.switch_pro.dpad_up=DpadUp
bind.switch_pro.dpad_down=DpadDown
bind.switch_pro.dpad_left=DpadLeft
bind.switch_pro.dpad_right=DpadRight

# Nunchuk: stick izquierdo, Z en L2, C en L1.
bind.switch_pro.stick_up=LY+
bind.switch_pro.stick_down=LY-
bind.switch_pro.stick_left=LX-
bind.switch_pro.stick_right=LX+
bind.switch_pro.z=ZL
bind.switch_pro.c=L

# Puntero IR: stick derecho; el clic del stick lo recentra.
bind.switch_pro.pointer_up=RY+
bind.switch_pro.pointer_down=RY-
bind.switch_pro.pointer_left=RX-
bind.switch_pro.pointer_right=RX+
bind.switch_pro.pointer_recenter=RS

# Sacudida: R1 agita el Wii Remote. (Es un pulso sintetico, no un acelerometro: la consola no lo tiene.)
bind.switch_pro.shake=R
bind.switch_pro.nunchuk_shake=None

# Ajustes: zonas muertas (fraccion de la inclinacion), velocidad del puntero (unidades por segundo; 2 = el ancho de la
# imagen), invertir el eje Y del puntero, y segundos de reposo antes de ocultarlo (0: nunca).
tune.switch_pro.stick_deadzone=0.12
tune.switch_pro.pointer_deadzone=0.12
tune.switch_pro.pointer_speed=2.4
tune.switch_pro.invert_pointer_y=0
tune.switch_pro.pointer_hide_seconds=0
