# ULTRA-GLES: los recorridos de NEBULA_ULTRA=serie, uno por seccion, en este orden; cada uno con los ajustes de su
# seccion encima de los normales. Al final, smg/ultra/<fecha>-serie/comparacion.txt los compara con el primero.
# Se pueden anadir, quitar o cambiar secciones; los nombres solo con letras, numeros, punto, guion y guion bajo.
# Una seccion con los mismos ajustes que la primera es su repeticion: compare.py la usa como medida del ruido.
# Sin el cargador puesto: el informe da el consumo de la bateria de cada recorrido.
#
# Series del 29-oct: el frame saltado barato (update54) y el hilo GL se quedan; la resolucion dinamica (auto, por
# defecto desde update61) bajo la GPU 48 %. Con la CPU a 1,7 GHz (cpu-max) el recorrido dura lo mismo (181 s) y "CPU render"
# solo baja 7 %: la CPU no es el limite. salto3 lo acorta 11 % (161 s) pero con el doble de tirones por minuto.
# Esta serie mira donde espera cada hilo (muestreo de pilas de todos los hilos durante el recorrido).

[calentamiento]

[defecto]

# Muestreo de hilos (20 muestras por segundo, rondas de 20 s): deja muestras.txt en la carpeta del recorrido, con las
# pilas completas de cada hilo del juego. Cuesta algo de CPU: sus cifras no se comparan con las de arriba, el
# interes es donde esta el tiempo.
[perfil]
NEBULA_PROFILE=20
NEBULA_PROFILE_EVERY=20
NEBULA_PROFILE_ROUNDS=200
GALAXY_GX_FRAME_TIMING_SAMPLE=30
