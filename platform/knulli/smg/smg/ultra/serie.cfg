# ULTRA-GLES: los recorridos de NEBULA_ULTRA=serie, uno por seccion, en este orden; cada uno con los ajustes de su
# seccion encima de los normales. Al final, smg/ultra/<fecha>-serie/comparacion.txt los compara con el primero.
# Se pueden anadir, quitar o cambiar secciones; los nombres solo con letras, numeros, punto, guion y guion bajo.
# Una seccion con los mismos ajustes que la primera (base2) es su repeticion: compare.py la usa como medida del ruido.

# Los ajustes de siempre (update48: cada display list compara sus bytes con la memoria una vez por frame).
[base]

# Cuatro frames en vuelo (smg/nebula-f4): en update47 dio +5 % de frames dibujados; aqui se repite para confirmarlo.
[vuelo4]
NEBULA_ULTRA_BIN=nebula-f4
GALAXY_GLES_RING_INDEX_MB=3
GALAXY_GLES_RING_MATRIX_MB=3

# El binario de update47 (sin el cambio de las display lists): lo que cambie frente a base es ese cambio.
[u47]
NEBULA_ULTRA_BIN=nebula-u47

# El de update46 (antes de las lecturas del EFB sin expandir).
[u46]
NEBULA_ULTRA_BIN=nebula-u46

# Repeticiones: lo que se mueve sin cambiar nada.
[base2]

[vuelo4b]
NEBULA_ULTRA_BIN=nebula-f4
GALAXY_GLES_RING_INDEX_MB=3
GALAXY_GLES_RING_MATRIX_MB=3
