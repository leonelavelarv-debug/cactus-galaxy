# ULTRA-GLES: los recorridos de NEBULA_ULTRA=serie, uno por seccion, en este orden; cada uno con los ajustes de su
# seccion encima de los normales. Al final, smg/ultra/<fecha>-serie/comparacion.txt los compara con el primero.
# Se pueden anadir, quitar o cambiar secciones; los nombres solo con letras, numeros, punto, guion y guion bajo.

# Los ajustes de siempre.
[base]

# Lo mismo otra vez: lo que cambie entre base y base2 es el ruido de la medicion.
[base2]

# El salto de frames puede saltar hasta 3 seguidos (1 de cada 4 dibujado): el juego mantiene mejor su velocidad.
[salto3]
GALAXY_FRAMESKIP_MAX=3

# Como base, anotando donde gasta el tiempo cada hilo (muestras.txt, lineas [sampler] de log.txt) y el desglose de
# cada fase GX cada 30 frames ([gx-frame-timing]); sus cifras salen algo peor por el propio muestreo.
[perfil]
NEBULA_PROFILE=15
NEBULA_PROFILE_EVERY=15
NEBULA_PROFILE_ROUNDS=200
GALAXY_GX_FRAME_TIMING_SAMPLE=30
