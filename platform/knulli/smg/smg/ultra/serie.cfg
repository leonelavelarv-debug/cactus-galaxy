# ULTRA-GLES: los recorridos de NEBULA_ULTRA=serie, uno por seccion, en este orden; cada uno con los ajustes de su
# seccion encima de los normales. Al final, smg/ultra/<fecha>-serie/comparacion.txt los compara con el primero.
# Se pueden anadir, quitar o cambiar secciones; los nombres solo con letras, numeros, punto, guion y guion bajo.
# Una seccion con los mismos ajustes que la primera (defecto2) es su repeticion: compare.py la usa como medida del ruido.
# Sin el cargador puesto: el informe da el consumo de la bateria de cada recorrido.

# Lo de siempre desde update54: los frames saltados no preparan los draws de las display lists que luego tirarian.
[defecto]

# Como hasta update53: el frame saltado prepara todo (estado, texturas, vertices, indices) y lo descarta al final.
# Lo que cambia entre esta y la primera es el coste de un frame saltado: mira "CPU render", "FPS mostrados" y, sobre
# todo, "duracion del recorrido" (el recorrido es el mismo en tiempo de juego: menos reloj = juego mas rapido).
[salto-lento]
GALAXY_FRAMESKIP_FAST=0

# Con frames saltados baratos cabe saltar hasta tres de cada cuatro: si el dibujado cuesta mas de dos frames, el
# controlador automatico lo usa y el juego sigue a su velocidad a costa de imagenes (15 por segundo).
[salto3]
GALAXY_FRAMESKIP_MAX=3

# Repeticion.
[defecto2]
