# ULTRA-GLES: los recorridos de NEBULA_ULTRA=serie, uno por seccion, en este orden; cada uno con los ajustes de su
# seccion encima de los normales. Al final, smg/ultra/<fecha>-serie/comparacion.txt los compara con el primero.
# Se pueden anadir, quitar o cambiar secciones; los nombres solo con letras, numeros, punto, guion y guion bajo.
# Una seccion con los mismos ajustes que la primera es su repeticion: compare.py la usa como medida del ruido.
# Sin el cargador puesto: el informe da el consumo de la bateria de cada recorrido.
#
# Serie de la memoria (docs/GX_ES_MEMORY_GROWTH.md): un recorrido por las 44 galaxias con la ruta normal, con una
# linea [memoria] cada 30 s en log.txt (lo que ocupa cada cache). Antes el recorrido se cortaba en la 7.a galaxia
# (CosmosGardenGalaxy: UploadRing 'vertex' exhausted); ahora log.txt dice "[ring] vertex: a frame needed more ...".
# La serie del paso 2 de GX-ES (fetch, antes, es30) esta en docs/GX_ES_STEP2_RESULTS.md.

[memoria]
GALAXY_GX_MEMORY_LOG=30
# Quien tiene los bloques grandes del monton (memtrace_knulli.cpp): lineas [memtrace] tras cada [memoria].
NEBULA_MEMTRACE=1
NEBULA_MEMTRACE_MIN_KB=256
# 44 galaxias a ~30 s cada una no caben en los 900 s de siempre.
NEBULA_ULTRA_LIMITE=2400
