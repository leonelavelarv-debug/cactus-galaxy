# ULTRA-GLES: los recorridos de NEBULA_ULTRA=serie, uno por seccion, en este orden; cada uno con los ajustes de su
# seccion encima de los normales. Al final, smg/ultra/<fecha>-serie/comparacion.txt los compara con el primero.
# Se pueden anadir, quitar o cambiar secciones; los nombres solo con letras, numeros, punto, guion y guion bajo.
# Una seccion con los mismos ajustes que la primera es su repeticion: compare.py la usa como medida del ruido.
# Sin el cargador puesto: el informe da el consumo de la bateria de cada recorrido.
#
# El primer recorrido sale siempre peor (cachos de shaders y frecuencias en frio: en la serie del 29-oct, 242 s frente
# a 201 s de su repeticion), asi que la primera seccion es un calentamiento con los ajustes de siempre y la base
# real son sus repeticiones (defecto, defecto2). Las secciones a probar van intercaladas con ellas para que el orden
# no pese: salto-lento va entre dos defecto.

# Calentamiento y base de la comparacion: lo de siempre desde update54 (los frames saltados no preparan los draws de
# las display lists que luego tirarian).
[calentamiento]

[defecto]

# Como hasta update53: el frame saltado prepara todo (estado, texturas, vertices, indices) y lo descarta al final.
# Mira "CPU render" (con FAST=1 ~18 % menos en la serie del 29-oct) y "duracion del recorrido".
[salto-lento]
GALAXY_FRAMESKIP_FAST=0

[defecto2]

[salto-lento2]
GALAXY_FRAMESKIP_FAST=0

# Opcional (quitale la almohadilla a las dos lineas de abajo): saltar hasta tres de cada cuatro frames. En la serie del
# 29-oct: 10 % menos tiempo de recorrido y 35 FPS mostrados, pero el doble de tirones por minuto (194 frente a 89).
#[salto3]
#GALAXY_FRAMESKIP_MAX=3
