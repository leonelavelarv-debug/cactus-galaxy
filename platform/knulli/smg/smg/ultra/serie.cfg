# ULTRA-GLES: los recorridos de NEBULA_ULTRA=serie, uno por seccion, en este orden; cada uno con los ajustes de su
# seccion encima de los normales. Al final, smg/ultra/<fecha>-serie/comparacion.txt los compara con el primero.
# Se pueden anadir, quitar o cambiar secciones; los nombres solo con letras, numeros, punto, guion y guion bajo.
# Una seccion con los mismos ajustes que la primera (defecto2) es su repeticion: compare.py la usa como medida del ruido.
# Sin el cargador puesto: el informe da el consumo de la bateria de cada recorrido.

# Lo de siempre desde update52: el hilo GL y cuatro frames en vuelo.
[defecto]

# Como hasta update51: un solo hilo y tres frames en vuelo (smg/nebula-f3), para ver lo que gana y lo que gasta.
[sin-hilo]
GALAXY_GLES_THREAD=0
NEBULA_ULTRA_BIN=nebula-f3
GALAXY_GLES_RING_INDEX_MB=6
GALAXY_GLES_RING_MATRIX_MB=8

# Buscando el 17 % de GPU de mas con el hilo: las copias de las lecturas del EFB solo entre frames...
[borde]
GALAXY_GLES_THREAD_JOBS=frame

# ...o el hilo GL sin bloquearse en glClientWaitSync cuando no tiene trabajo.
[sondeo]
GALAXY_GLES_THREAD_WAIT=poll

# Repeticion.
[defecto2]
