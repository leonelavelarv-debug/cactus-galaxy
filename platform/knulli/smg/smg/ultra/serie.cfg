# ULTRA-GLES: los recorridos de NEBULA_ULTRA=serie, uno por seccion, en este orden; cada uno con los ajustes de su
# seccion encima de los normales. Al final, smg/ultra/<fecha>-serie/comparacion.txt los compara con el primero.
# Se pueden anadir, quitar o cambiar secciones; los nombres solo con letras, numeros, punto, guion y guion bajo.
# Una seccion con los mismos ajustes que la primera es su repeticion: compare.py la usa como medida del ruido.
# Sin el cargador puesto: el informe da el consumo de la bateria de cada recorrido.
#
# Serie del 29-oct (update58): el ruido entre repeticiones es minimo (201,3 / 201,4 / 201,1 s) y GALAXY_FRAMESKIP_FAST=0
# sale 10 % mas lento (221 s) y con 18 % mas "CPU render": los frames saltados baratos (update54) ayudan.
# Ahora el cuello es la GPU (15,7 ms de 16,7 por frame del juego): esta serie prueba lo que le quita trabajo.
# El primer recorrido es un calentamiento (el primero sale siempre peor) y la base real son defecto y defecto2.

# Calentamiento y base: los ajustes de siempre (resolucion interna 100 = 640x528, antialiasing, hilo GL).
[calentamiento]

[defecto]

# Resolucion interna 75 (480x396, ~44 % menos pixeles). Mira "GPU" y "duracion del recorrido"; la imagen se ve mas
# blanda (las capturas de esta seccion no se comparan por PSNR con las de 100: tienen otro tamano).
[res75]
GALAXY_GLES_RESOLUTION=75

# Sin antialiasing (la pasada FXAA de la copia a pantalla).
[sin-aa]
GALAXY_GLES_AA=0

# El driver GL en el mismo hilo (sin GALAXY_GLES_THREAD): la serie anterior dejo sin resolver si el hilo GL cuesta
# ~17 % mas de GPU. Mira "GPU", "CPU render" y "hilo GL (CPU)".
[sin-hilo]
GALAXY_GLES_THREAD=0

[defecto2]
