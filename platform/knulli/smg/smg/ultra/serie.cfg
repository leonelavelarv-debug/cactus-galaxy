# ULTRA-GLES: los recorridos de NEBULA_ULTRA=serie, uno por seccion, en este orden; cada uno con los ajustes de su
# seccion encima de los normales. Al final, smg/ultra/<fecha>-serie/comparacion.txt los compara con el primero.
# Se pueden anadir, quitar o cambiar secciones; los nombres solo con letras, numeros, punto, guion y guion bajo.

# Los ajustes de siempre (ya con las lecturas del EFB sin expandir, update47).
[base]

# Cuatro frames en vuelo en vez de tres (otra compilacion, smg/nebula-f4): el hilo de render esperaba ~21 % de su
# tiempo a que la GPU soltara un frame. Anillos mas justos para que no crezca la memoria.
[vuelo4]
NEBULA_ULTRA_BIN=nebula-f4
GALAXY_GLES_RING_INDEX_MB=3
GALAXY_GLES_RING_MATRIX_MB=3

# El juego puede ir tres frames por delante del render en vez de dos (cola mas larga).
[cola3]
GALAXY_RENDER_QUEUE_DEPTH=3

# Todo junto: cuatro en vuelo, cola de tres y salto de hasta tres frames.
[todo]
NEBULA_ULTRA_BIN=nebula-f4
GALAXY_GLES_RING_INDEX_MB=3
GALAXY_GLES_RING_MATRIX_MB=3
GALAXY_RENDER_QUEUE_DEPTH=3
GALAXY_FRAMESKIP_MAX=3
