# ULTRA-GLES: los recorridos de NEBULA_ULTRA=serie, uno por seccion, en este orden; cada uno con los ajustes de su
# seccion encima de los normales. Al final, smg/ultra/<fecha>-serie/comparacion.txt los compara con el primero.
# Se pueden anadir, quitar o cambiar secciones; los nombres solo con letras, numeros, punto, guion y guion bajo.

# Los ajustes de siempre.
[base]

# Shaders nuevos: dibujar con el shader uber mientras el suyo compila, en vez de esperar (sin parones).
[uber]
GALAXY_GLES_PENDING=uber

# Resolucion interna al 75 % (480x396 en vez de 640x528): menos trabajo para la GPU.
[res75]
GALAXY_GLES_RESOLUTION=75

# Como base, pero anotando en log.txt donde gasta el tiempo cada hilo (lineas [sampler]); sus cifras salen un poco
# peor por el propio muestreo, sirve para saber que optimizar.
[hilos]
NEBULA_PROFILE=20
NEBULA_PROFILE_EVERY=20
NEBULA_PROFILE_ROUNDS=200
