# ULTRA-GLES: los recorridos de NEBULA_ULTRA=serie, uno por seccion, en este orden; cada uno con los ajustes de su
# seccion encima de los normales. Al final, smg/ultra/<fecha>-serie/comparacion.txt los compara con el primero.
# Se pueden anadir, quitar o cambiar secciones; los nombres solo con letras, numeros, punto, guion y guion bajo.
# Una seccion con los mismos ajustes que la primera es su repeticion: compare.py la usa como medida del ruido.
# Sin el cargador puesto: el informe da el consumo de la bateria de cada recorrido.
#
# Series del 29-oct: el frame saltado barato (update54) y el hilo GL se quedan; la resolucion dinamica (auto, por defecto
# desde update61) bajo la GPU 48 %. Lo que limita ahora el recorrido es la CPU del juego: esta serie mira si mas
# frecuencia de CPU o mas frames saltados lo acortan. El primer recorrido es un calentamiento; la base real es defecto.

[calentamiento]

[defecto]

# La CPU al maximo del chip (1,7 GHz en vez de 1,5): si el recorrido se acorta, la CPU es el limite. Mas calor y consumo.
[cpu-max]
NEBULA_CPU_MAX=1

# Hasta tres de cada cuatro frames saltados (con frames saltados baratos y GPU holgada).
[salto3]
GALAXY_FRAMESKIP_MAX=3

[defecto2]
