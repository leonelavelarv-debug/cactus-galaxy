# ULTRA-GLES: los recorridos de NEBULA_ULTRA=serie, uno por seccion, en este orden; cada uno con los ajustes de su
# seccion encima de los normales. Al final, smg/ultra/<fecha>-serie/comparacion.txt los compara con el primero.
# Se pueden anadir, quitar o cambiar secciones; los nombres solo con letras, numeros, punto, guion y guion bajo.
# Una seccion con los mismos ajustes que la primera es su repeticion: compare.py la usa como medida del ruido.
# Sin el cargador puesto: el informe da el consumo de la bateria de cada recorrido.
#
# Series del 29-oct: el hilo GL se queda (sin el, el recorrido dura 20 % mas) y la CPU a 1,7 GHz no cambia nada. El
# muestreo de hilos mostro la cadena de esperas: el juego espera 42 % (__NebulaIdle), el hilo de render 28 % en
# wait_fence, el hilo GL 34 % sin trabajo y 25 % esperando a la GPU. Esta serie mira la profundidad del pipeline:
# frames en vuelo (se fija al compilar; el de siempre es 4, el maximo que admite el codigo) con binarios aparte:
# smg/nebula-f2 y smg/nebula-f3 (NEBULA_ULTRA_BIN en la seccion).

[calentamiento]

[defecto]

[f2]
NEBULA_ULTRA_BIN=nebula-f2

[f3]
NEBULA_ULTRA_BIN=nebula-f3

