# ULTRA-GLES: los recorridos de NEBULA_ULTRA=serie, uno por seccion, en este orden; cada uno con los ajustes de su
# seccion encima de los normales. Al final, smg/ultra/<fecha>-serie/comparacion.txt los compara con el primero.
# Se pueden anadir, quitar o cambiar secciones; los nombres solo con letras, numeros, punto, guion y guion bajo.
# Una seccion con los mismos ajustes que la primera es su repeticion: compare.py la usa como medida del ruido.
# Sin el cargador puesto: el informe da el consumo de la bateria de cada recorrido.
#
# Serie del 29-oct (update59): el hilo GL es una ganancia grande (sin el, "CPU render" 23,2 frente a 11,8 ms y el recorrido
# 241 s frente a 201 s; la GPU solo baja 5 %), asi que se queda. Resolucion 75: GPU 16,1 -> 11,5 ms (-28 %), p95 -10 %,
# FPS mostrados +8 %; sin antialiasing: FPS mostrados +10 %, p95 -6 %. El recorrido dura lo mismo (201 s) en ambos: lo
# que lo limita ahora es la CPU del juego, no la GPU. Esta serie mira como combinarlos y si la dinamica lo hace sola.
# El primer recorrido es un calentamiento y la base real son defecto y defecto2.

[calentamiento]

[defecto]

# La resolucion dinamica: baja sola cuando la GPU no llega (empieza en 75, entre 50 y 100).
[auto]
GALAXY_GLES_RESOLUTION=auto

# 75 sin antialiasing: lo que mas GPU quita sin tocar el resto.
[res75-sin-aa]
GALAXY_GLES_RESOLUTION=75
GALAXY_GLES_AA=0

# 60 (384x317): hasta donde se aguanta antes de que se vea mal.
[res60]
GALAXY_GLES_RESOLUTION=60

[defecto2]
